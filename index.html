<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Explorer 英語探險家</title>
    <style>
        body {
            font-family: "Varela Round", "Segoe UI Rounded", "Helvetica Neue Rounded", "Arial Rounded MT Bold", sans-serif;
            background-color: #f0faff; 
            color: #555;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: white;
            padding: 35px 25px;
            border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(173, 216, 230, 0.3); 
        }

        h1 { color: #ff9aa2; font-size: 32px; margin-bottom: 8px; }
        h2 { color: #a2d2ff; font-weight: normal; margin-top: 0; margin-bottom: 25px; font-size: 20px; }
        h3 { color: #666; margin-bottom: 15px; }

        .grade-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .grade-tab {
            border: none;
            background-color: #f1f5f9;
            color: #64748b;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: none;
            margin: 4px;
            transition: all 0.2s ease;
        }

        .grade-tab:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .grade-tab.active {
            background-color: #ff9aa2;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 154, 162, 0.35);
        }

        .grade-panel {
            display: none;
        }

        .grade-panel.active {
            display: block;
        }

        .grade-section {
            background-color: #f8f9fa;
            border-radius: 20px;
            padding: 22px 18px;
            margin-bottom: 20px;
            border: 2px dashed #dcdde1;
        }

        .unit-selector-box {
            margin: 12px 0 16px;
            text-align: center;
        }

        .sub-heading {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .unit-select {
            width: 100%;
            max-width: 520px;
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            border-radius: 15px;
            border: 2px solid #b3e5fc;
            background-color: #fff;
            color: #444;
            outline: none;
            cursor: pointer;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
        }

        .unit-select:focus {
            border-color: #a2d2ff;
        }

        button {
            border: none;
            padding: 12px 20px;
            margin: 8px 5px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit; 
            border-radius: 50px; 
            cursor: pointer;
            transition: all 0.2s ease; 
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); 
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0,0,0,0.1); }
        button:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-listen-mode { background-color: #ffe1a8; color: #8a6d3b; } 
        .btn-listen-mode:hover { background-color: #ffd88f; }
        .btn-write-mode { background-color: #c7ceea; color: #6a7194; } 
        .btn-write-mode:hover { background-color: #b8c0e0; }
        .btn-phonics-mode { background-color: #ffb7b2; color: #c94c4c; } 
        .btn-phonics-mode:hover { background-color: #ff9e99; }
        
        .btn-action { background-color: #a2d2ff; color: white; margin-bottom: 15px;}
        .btn-action:hover { background-color: #89c4ff; }
        
        .btn-speed { background-color: #ffd166; color: #8a6d3b; margin-bottom: 15px;}
        .btn-speed:hover { background-color: #ffc233; }

        .btn-submit { background-color: #b5e7a0; color: #4a7c34; font-size: 20px; padding: 15px 30px;}
        .btn-submit:hover { background-color: #9cdb82; }
        .btn-restart { background-color: #e2e8f0; color: #64748b; margin-top: 20px;}
        .btn-restart:hover { background-color: #cbd5e1; }
        .btn-review { background-color: #ff9e99; color: white; margin-top: 20px; font-size: 18px; animation: pulse 1.5s infinite;}
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-exit { background-color: #e2e8f0; color: #64748b; padding: 8px 15px; font-size: 14px; margin: 0; box-shadow: none; }
        .btn-exit:hover { background-color: #cbd5e1; color: #475569; transform: scale(1.05); box-shadow: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }

        #question-box { margin: 10px 0; }
        #question-text { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #666; word-wrap: break-word; line-height: 1.4; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        
        .option-btn { background-color: #fff; border: 3px solid #e1f5fe; color: #555; font-size: 20px; box-shadow: none; padding: 15px 10px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .option-btn:hover { background-color: #e1f5fe; border-color: #b3e5fc; transform: scale(1.03); }
        .option-en-text { font-size: 16px; color: #888; margin-top: 4px; font-weight: normal; }

        #write-box { margin-top: 20px; }
        
        #hint-text { font-size: 26px; color: #a2d2ff; letter-spacing: 4px; font-family: monospace; font-weight: bold; margin-bottom: 15px; }

        input[type="text"] {
            padding: 15px;
            font-size: 22px;
            border-radius: 15px;
            border: 3px solid #e1f5fe;
            width: 80%;
            max-width: 350px;
            text-align: center;
            font-family: inherit;
            outline: none;
            margin-bottom: 20px;
            color: #555;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #a2d2ff; }

        #feedback { font-size: 22px; font-weight: bold; min-height: 40px; line-height: 40px; margin-top: 20px; border-radius: 10px; padding: 5px; }
        .correct { color: #b5e7a0; background-color: #f0fff0; } 
        .wrong { color: #ffb7b2; background-color: #fff5f5; } 

        #score-board { font-size: 16px; color: #aaa; margin-bottom: 20px; letter-spacing: 1px; }
        #score { color: #ff9aa2; font-weight: bold; font-size: 20px;}
        .mode-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0; background: #eee;}
        
        .next-stage-container { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #e1f5fe; }
        .next-stage-container p { color: #a2d2ff; font-weight: bold; margin-bottom: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="data.js?v=114"></script>
</head>
<body>

    <div class="container">
        <h1>🚀 English Explorer</h1>
        <h2>英語探險家・翰林版單字王題庫</h2>
        
        <div id="start-screen">
            <div class="grade-tabs">
                <button class="grade-tab" onclick="switchGradeTab(3)" id="tab-btn-3">🌱 三年級 (G3)</button>
                <button class="grade-tab active" onclick="switchGradeTab(4)" id="tab-btn-4">🌿 四年級 (G4)</button>
                <button class="grade-tab" onclick="switchGradeTab(5)" id="tab-btn-5">🌟 五年級 (G5)</button>
                <button class="grade-tab" onclick="switchGradeTab(6)" id="tab-btn-6">🚀 六年級 (G6)</button>
            </div>

            <!-- 動態年級選單 -->
            <div id="grade-panels-container">載入題庫中...</div>
        </div>

        <div id="game-screen" class="hidden">
            <div class="top-bar">
                <div id="current-mode-badge" class="mode-badge">Mode</div>
                <button class="btn-exit" onclick="resetGame()">🏠 回首頁</button>
            </div>

            <div id="score-board">Score: <span id="score">0</span> / <span id="total">10</span></div>
            
            <div id="question-box">
                <button class="btn-action hidden" id="btn-replay-sound" onclick="playCurrentSound()">🔊 聽聲音</button>
                <button class="btn-speed hidden" id="btn-speed-toggle" onclick="toggleSpeed()">🏃 正常語速</button>
                <div id="question-text">Question</div>
            </div>

            <div class="options-grid" id="options"></div>
            
            <div id="write-box" class="hidden">
                <div id="hint-text"></div>
                
                <input type="text" id="answer-input" placeholder="請輸入英文..." autocomplete="off">
                <br>
                <button class="btn-submit" onclick="checkWrittenAnswer()">送出答案</button>
            </div>
            
            <div id="feedback"></div>

            <button class="btn-review hidden" id="review-btn" onclick="startReview()">🔥 挑戰錯題</button>
            
            <div id="next-stage-box" class="next-stage-container hidden">
                <p>✨ 挑戰下一關：</p>
                <div id="next-stage-buttons"></div>
                <button class="btn-restart" id="restart-btn" onclick="resetGame()">🏠 休息一下，回首頁</button>
            </div>
        </div>
    </div>

    <script>
        var currentQuestions = [];
        var currentQuestionIndex = 0;
        var score = 0;
        var mistakes = []; 
        var gameMode = 'listen'; 
        var currentGameGrade = 4;
        var currentUnitId = 'all';
        var activeGradeTab = 4;
        var availableVoices = [];
        var isProcessing = false; 
        var currentSpeechRate = 0.8; 

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                availableVoices = window.speechSynthesis.getVoices();
            };
        }

        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkWrittenAnswer();
            }
        });

        function switchGradeTab(grade) {
            activeGradeTab = grade;
            document.querySelectorAll(".grade-tab").forEach(function(tab) { tab.classList.remove("active"); });
            var activeTabBtn = document.getElementById("tab-btn-" + grade);
            if (activeTabBtn) activeTabBtn.classList.add("active");

            document.querySelectorAll(".grade-panel").forEach(function(panel) { panel.classList.remove("active"); });
            var activePanel = document.getElementById("panel-grade-" + grade);
            if (activePanel) activePanel.classList.add("active");
        }

        function renderStartScreen() {
            var container = document.getElementById("grade-panels-container");
            if (!container) return;
            if (!window.QUESTION_BANK) {
                setTimeout(renderStartScreen, 100);
                return;
            }

            container.innerHTML = "";
            [3, 4, 5, 6].forEach(function(g) {
                var units = window.QUESTION_BANK.unitCatalog.filter(function(u) { return u.grade === g; });
                var totalGradeQ = window.QUESTION_BANK.allByGrade[g] ? window.QUESTION_BANK.allByGrade[g].length : 0;
                var hasPhonicsInGrade = window.QUESTION_BANK.allByGrade[g] && window.QUESTION_BANK.allByGrade[g].some(function(q) { return q.type === 'phonics'; });

                var panel = document.createElement("div");
                panel.className = "grade-panel " + (g === activeGradeTab ? "active" : "");
                panel.id = "panel-grade-" + g;

                var section = document.createElement("div");
                section.className = "grade-section";

                var title = document.createElement("h3");
                title.innerText = "🏆 " + g + "年級 英語單字王題庫";
                section.appendChild(title);

                var selectorBox = document.createElement("div");
                selectorBox.className = "unit-selector-box";

                var subHeading = document.createElement("div");
                subHeading.className = "sub-heading";
                subHeading.innerText = "選擇測驗單元 / 範圍：";
                selectorBox.appendChild(subHeading);

                var select = document.createElement("select");
                select.className = "unit-select";
                select.id = "unit-select-" + g;

                var allOpt = document.createElement("option");
                allOpt.value = "all";
                allOpt.innerText = "⭐ 全年級單字王大會考 (隨機 10 題 / 共 " + totalGradeQ + " 題)";
                select.appendChild(allOpt);

                units.forEach(function(u) {
                    var opt = document.createElement("option");
                    opt.value = u.id;
                    opt.innerText = u.book + " - " + u.title + " (" + u.count + " 題)";
                    select.appendChild(opt);
                });

                selectorBox.appendChild(select);
                section.appendChild(selectorBox);

                var buttonBox = document.createElement("div");
                buttonBox.style.marginTop = "15px";

                var listenBtn = document.createElement("button");
                listenBtn.className = "btn-listen-mode";
                listenBtn.innerText = "🎧 聽力測驗";
                listenBtn.onclick = function() {
                    var sel = document.getElementById("unit-select-" + g);
                    startGame(g, "listen", sel ? sel.value : "all");
                };
                buttonBox.appendChild(listenBtn);

                var phonicsBtn = document.createElement("button");
                phonicsBtn.className = "btn-phonics-mode";
                phonicsBtn.id = "btn-phonics-" + g;
                phonicsBtn.innerText = "🗣️ 自然發音";
                phonicsBtn.style.display = hasPhonicsInGrade ? "inline-block" : "none";
                phonicsBtn.onclick = function() {
                    var sel = document.getElementById("unit-select-" + g);
                    startGame(g, "phonics", sel ? sel.value : "all");
                };
                buttonBox.appendChild(phonicsBtn);

                var writeBtn = document.createElement("button");
                writeBtn.className = "btn-write-mode";
                writeBtn.innerText = "✍️ 聽音拼寫";
                writeBtn.onclick = function() {
                    var sel = document.getElementById("unit-select-" + g);
                    startGame(g, "write", sel ? sel.value : "all");
                };
                buttonBox.appendChild(writeBtn);

                select.onchange = function() {
                    var unitId = select.value;
                    if (unitId === "all") {
                        phonicsBtn.style.display = hasPhonicsInGrade ? "inline-block" : "none";
                    } else {
                        var u = window.QUESTION_BANK.unitCatalog.find(function(item) { return item.id === unitId; });
                        phonicsBtn.style.display = (u && u.hasPhonics) ? "inline-block" : "none";
                    }
                };

                section.appendChild(buttonBox);
                panel.appendChild(section);
                container.appendChild(panel);
            });
        }

        function toggleSpeed() {
            var speedBtn = document.getElementById("btn-speed-toggle");
            if (currentSpeechRate === 0.8) {
                currentSpeechRate = 0.55; 
                speedBtn.innerText = "🐢 超慢速播放";
                speedBtn.style.backgroundColor = "#f4a261"; 
                speedBtn.style.color = "white";
            } else {
                currentSpeechRate = 0.8;
                speedBtn.innerText = "🏃 正常語速";
                speedBtn.style.backgroundColor = "#ffd166";
                speedBtn.style.color = "#8a6d3b";
            }
            playCurrentSound(); 
        }

        function generateHint(text) {
            var result = "";
            var isFirstLetter = true;
            for (var i = 0; i < text.length; i++) {
                var c = text[i];
                if (/[a-zA-Z]/.test(c)) {
                    if (isFirstLetter) {
                        result += c + " ";
                        isFirstLetter = false;
                    } else {
                        result += "_ ";
                    }
                } else {
                    result += c + " ";
                    isFirstLetter = true; 
                }
            }
            return result.trim();
        }

        function startGame(grade, mode, unitId) {
            if (!unitId) unitId = "all";
            currentGameGrade = grade;
            currentUnitId = unitId;
            gameMode = mode;
            mistakes = []; 
            
            var dataset = [];
            var scopeLabel = grade + "年級";

            if (currentUnitId === "all") {
                dataset = (window.QUESTION_BANK && window.QUESTION_BANK.allByGrade[grade]) ? window.QUESTION_BANK.allByGrade[grade].slice() : [];
                scopeLabel = grade + "年級大挑戰";
            } else {
                var unitObj = window.QUESTION_BANK && window.QUESTION_BANK.unitCatalog.find(function(u) { return u.id === currentUnitId; });
                if (unitObj) {
                    dataset = unitObj.questions.slice();
                    scopeLabel = grade + "年級 " + unitObj.unit;
                } else {
                    dataset = (window.QUESTION_BANK && window.QUESTION_BANK.allByGrade[grade]) ? window.QUESTION_BANK.allByGrade[grade].slice() : [];
                }
            }
            
            if (mode === "phonics") {
                dataset = dataset.filter(function(q) { return q.type === 'phonics'; });
            } else {
                dataset = dataset.filter(function(q) { return q.type !== 'phonics'; });
            }
            
            currentQuestions = dataset.slice().sort(function() { return 0.5 - Math.random(); });
            if (currentQuestions.length > 10) {
                currentQuestions = currentQuestions.slice(0, 10);
            }
            
            var badgeColor, badgeText;
            if (mode === "listen") {
                badgeColor = "#ffe1a8";
                badgeText = "🎧 " + scopeLabel + " 聽力測驗";
            } else if (mode === "write") {
                badgeColor = "#c7ceea";
                badgeText = "✍️ " + scopeLabel + " 聽音拼寫";
            } else {
                badgeColor = "#ffb7b2";
                badgeText = "🗣️ " + scopeLabel + " 自然發音";
            }

            document.getElementById("current-mode-badge").innerText = badgeText;
            document.getElementById("current-mode-badge").style.backgroundColor = badgeColor;

            currentSpeechRate = 0.8;
            document.getElementById("btn-speed-toggle").innerText = "🏃 正常語速";
            document.getElementById("btn-speed-toggle").style.backgroundColor = "#ffd166";
            document.getElementById("btn-speed-toggle").style.color = "#8a6d3b";

            initGameUI();
        }

        function startReview() {
            currentQuestions = mistakes.slice().sort(function() { return 0.5 - Math.random(); });
            mistakes = []; 
            document.getElementById("current-mode-badge").innerText = "🔥 錯題特訓區";
            document.getElementById("current-mode-badge").style.backgroundColor = "#ffb7b2";
            initGameUI();
        }

        function initGameUI() {
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("review-btn").classList.add("hidden");
            document.getElementById("next-stage-box").classList.add("hidden");
            
            score = 0;
            currentQuestionIndex = 0;
            isProcessing = false;
            document.getElementById("score").innerText = score;
            document.getElementById("total").innerText = currentQuestions.length;

            loadQuestion();
        }

        function loadQuestion() {
            isProcessing = false; 
            
            if (currentQuestionIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            var qData = currentQuestions[currentQuestionIndex];
            var feedback = document.getElementById("feedback");
            feedback.innerText = "";
            feedback.className = "";
            
            if (gameMode === "listen" || gameMode === "phonics") {
                var promptText = gameMode === "phonics" ? "👂 聽音辨字：\n請仔細聽發音，選出正確的單字！" : "👂 請仔細聽，選出正確意思";
                document.getElementById("question-text").innerText = promptText;
                document.getElementById("btn-replay-sound").classList.remove("hidden");
                document.getElementById("btn-speed-toggle").classList.remove("hidden");
                document.getElementById("options").classList.remove("hidden");
                document.getElementById("write-box").classList.add("hidden");
                
                var optionsDiv = document.getElementById("options");
                optionsDiv.innerHTML = "";
                
                var correctAnswer = gameMode === "phonics" ? qData.en : qData.zh + "|" + qData.en; 
                var wrongOptions = qData.options.filter(function(opt) { return opt !== correctAnswer; }); 
                var randomWrong = wrongOptions.length > 0 
                    ? wrongOptions[Math.floor(Math.random() * wrongOptions.length)] 
                    : (gameMode === "phonics" ? "apple" : "其他|other"); 
                
                var finalOptions = [correctAnswer, randomWrong].sort(function() { return 0.5 - Math.random(); });

                finalOptions.forEach(function(opt) {
                    var btn = document.createElement("button");
                    btn.className = "option-btn";
                    
                    if (opt.includes("|")) {
                        var parts = opt.split("|");
                        btn.innerHTML = "<span>" + parts[0] + "</span><span class=\"option-en-text\">" + parts[1] + "</span>";
                    } else {
                        btn.innerText = opt; 
                    }

                    btn.onclick = function() { checkAnswer(opt, qData); };
                    optionsDiv.appendChild(btn);
                });

                playCurrentSound();

            } else {
                document.getElementById("options").classList.add("hidden");
                document.getElementById("write-box").classList.remove("hidden");
                document.getElementById("btn-replay-sound").classList.remove("hidden");
                document.getElementById("btn-speed-toggle").classList.remove("hidden");
                
                document.getElementById("question-text").innerText = "👂 聽音拼字：\n請聽發音並搭配提示拼出英文\n(中文：" + qData.zh + ")";
                document.getElementById("hint-text").innerText = generateHint(qData.en);

                var inputField = document.getElementById("answer-input");
                inputField.value = "";
                inputField.placeholder = "請輸入英文...";
                inputField.style.borderColor = "#e1f5fe";
                inputField.disabled = false;
                
                var submitBtn = document.querySelector(".btn-submit");
                submitBtn.disabled = false;
                setTimeout(function() { inputField.focus(); }, 200); 
                
                playCurrentSound(); 
            }
        }

        function checkAnswer(selected, qData) {
            if (isProcessing) return; 
            isProcessing = true; 
            
            var buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(function(btn) { btn.disabled = true; });
            
            var isCorrect = false;
            var correctText = "";
            
            if (gameMode === "phonics") {
                isCorrect = (selected === qData.en);
                correctText = qData.en;
            } else {
                var expected = qData.zh + "|" + qData.en;
                isCorrect = (selected === expected);
                correctText = qData.zh + " " + qData.en; 
            }
            
            processResult(isCorrect, correctText, qData);
        }

        function cleanString(str) {
            return str.toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
        }

        function checkWrittenAnswer() {
            if (isProcessing) return;

            var inputField = document.getElementById("answer-input");
            var submitBtn = document.querySelector(".btn-submit");
            var userAnswer = inputField.value;
            
            if (userAnswer.trim() === "") {
                inputField.placeholder = "⚠️ 請先輸入英文喔！";
                inputField.style.borderColor = "#ffb7b2";
                setTimeout(function() { inputField.style.borderColor = "#e1f5fe"; }, 1500);
                return; 
            }

            isProcessing = true;
            inputField.disabled = true;
            submitBtn.disabled = true;

            var qData = currentQuestions[currentQuestionIndex];
            var isCorrect = cleanString(userAnswer) === cleanString(qData.en);
            
            processResult(isCorrect, qData.en, qData);
        }

        function processResult(isCorrect, correctAnswerText, fullData) {
            var feedback = document.getElementById("feedback");
            
            if (isCorrect) {
                score++;
                document.getElementById("score").innerText = score;
                feedback.innerText = "🌟 Great Job! 完全正確！";
                feedback.className = "correct";
            } else {
                feedback.innerText = "Oops! 正確答案是: " + correctAnswerText;
                feedback.className = "wrong";
                if (!mistakes.includes(fullData)) {
                    mistakes.push(fullData);
                }
            }
            
            setTimeout(function() {
                currentQuestionIndex++;
                loadQuestion();
            }, 2300); 
        }

        function endGame() {
            document.getElementById("btn-replay-sound").classList.add("hidden");
            document.getElementById("btn-speed-toggle").classList.add("hidden");
            document.getElementById("options").classList.add("hidden");
            document.getElementById("write-box").classList.add("hidden");
            
            var message = "";
            if (score === currentQuestions.length) message = "🎉 滿分太神啦！You are a super explorer!";
            else if (score >= currentQuestions.length * 0.6) message = "👍 很棒喔！有幾題小粗心，要不要再挑戰？";
            else message = "💪 沒關係！把錯的練熟就會變超強！";

            document.getElementById("question-text").innerText = "Challenge Clear!";
            var resultHtml = "<div style=\"font-size: 24px; color: #ff9aa2; margin-top: 20px;\">你的總分是 " + score + " / " + currentQuestions.length + "<br><br>" + message + "</div>";
            document.getElementById("options").innerHTML = resultHtml;
            document.getElementById("options").classList.remove("hidden");
            document.getElementById("feedback").innerText = "";
            document.getElementById("feedback").className = "";
            
            if (mistakes.length > 0) {
                var reviewBtn = document.getElementById("review-btn");
                reviewBtn.innerText = "🔥 挑戰剛剛錯的 " + mistakes.length + " 題";
                reviewBtn.classList.remove("hidden");
            }

            var nextStageBox = document.getElementById("next-stage-box");
            var nextStageBtns = document.getElementById("next-stage-buttons");
            nextStageBtns.innerHTML = "";
            
            var activeQuestionsPool = currentUnitId === "all" 
                ? ((window.QUESTION_BANK && window.QUESTION_BANK.allByGrade[currentGameGrade]) || [])
                : ((window.QUESTION_BANK && window.QUESTION_BANK.unitCatalog.find(function(u) { return u.id === currentUnitId; })) ? window.QUESTION_BANK.unitCatalog.find(function(u) { return u.id === currentUnitId; }).questions : []);
            var hasPhonicsAvailable = activeQuestionsPool.some(function(q) { return q.type === 'phonics'; });

            if (gameMode !== "listen") {
                var btnListen = document.createElement("button");
                btnListen.className = "btn-listen-mode";
                btnListen.innerText = "🎧 挑戰聽力測驗";
                btnListen.onclick = function() { startGame(currentGameGrade, "listen", currentUnitId); };
                nextStageBtns.appendChild(btnListen);
            }
            if (gameMode !== "phonics" && hasPhonicsAvailable) {
                var btnPhonics = document.createElement("button");
                btnPhonics.className = "btn-phonics-mode";
                btnPhonics.innerText = "🗣️ 挑戰自然發音";
                btnPhonics.onclick = function() { startGame(currentGameGrade, "phonics", currentUnitId); };
                nextStageBtns.appendChild(btnPhonics);
            }
            if (gameMode !== "write") {
                var btnWrite = document.createElement("button");
                btnWrite.className = "btn-write-mode";
                btnWrite.innerText = "✍️ 挑戰聽音拼寫";
                btnWrite.onclick = function() { startGame(currentGameGrade, "write", currentUnitId); };
                nextStageBtns.appendChild(btnWrite);
            }
            var replayBtn = document.createElement("button");
            replayBtn.className = "btn-action";
            replayBtn.innerText = "🔄 本範圍再練一次";
            replayBtn.onclick = function() { startGame(currentGameGrade, gameMode, currentUnitId); };
            nextStageBtns.appendChild(replayBtn);
            
            nextStageBox.classList.remove("hidden");
        }

        function resetGame() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");
            document.getElementById("options").innerHTML = "";
            document.getElementById("question-text").innerText = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("feedback").className = "";
            document.getElementById("next-stage-box").classList.add("hidden");
            
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playCurrentSound() {
            var qData = currentQuestions[currentQuestionIndex];
            if (!qData) return;
            
            try {
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel(); 
                    
                    setTimeout(function() {
                        var utterance = new SpeechSynthesisUtterance(qData.en);
                        
                        if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

                        var bestVoice = availableVoices.find(function(v) { return v.name.includes("Google US English"); }) ||
                                        availableVoices.find(function(v) { return v.name.includes("Microsoft Zira"); }) ||
                                        availableVoices.find(function(v) { return v.name.includes("Samantha"); }) ||
                                        availableVoices.find(function(v) { return v.lang === "en-US" || v.lang === "en-GB"; });

                        if (bestVoice) utterance.voice = bestVoice;

                        utterance.lang = "en-US"; 
                        utterance.rate = currentSpeechRate; 
                        utterance.pitch = 1.0; 
                        
                        window.speechSynthesis.speak(utterance);
                    }, 100); 
                }
            } catch (error) {
                console.log("語音播放暫時無法使用", error);
            }
        }

        window.addEventListener("DOMContentLoaded", function() {
            renderStartScreen();
            switchGradeTab(activeGradeTab);
        });

        if (document.readyState === "interactive" || document.readyState === "complete") {
            renderStartScreen();
            switchGradeTab(activeGradeTab);
        }
    </script>
</body>
</html>
