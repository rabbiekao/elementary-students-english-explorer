<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Explorer 英語探險家</title>
    <style>
        /* 全域樣式：改成簡約可愛的圓體字，背景改成淡淡的粉藍色 */
        body {
            font-family: "Varela Round", "Segoe UI Rounded", "Helvetica Neue Rounded", "Arial Rounded MT Bold", sans-serif;
            background-color: #f0faff; /* 超淡粉藍色 */
            color: #555;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 遊戲主容器：大圓角、簡約陰影、白色背景 */
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px 30px;
            border-radius: 30px; /* 超大圓角 */
            box-shadow: 0 10px 25px rgba(173, 216, 230, 0.3); /* 淡淡的藍色陰影 */
        }

        /* 標題樣式：柔和的顏色 */
        h1 { 
            color: #ff9aa2; /* 柔和粉紅 */
            font-size: 32px;
            margin-bottom: 10px;
        }
        h2 { 
            color: #a2d2ff; /* 柔和藍 */
            font-weight: normal;
            margin-bottom: 30px;
        }

        /* 通用按鈕樣式：圓圓的、像泡泡一樣 */
        button {
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit; /* 繼承圓體字 */
            border-radius: 50px; /* 完全圓角 */
            cursor: pointer;
            transition: all 0.2s ease; /* 順滑的動畫 */
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); /* 底部一點點陰影增加立體感 */
        }

        /* 按鈕滑鼠移入效果：輕微浮起、陰影變大 */
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }

        /* 按鈕點擊效果：像真的按下去一樣 */
        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        /* 開始畫面的年級選擇按鈕顏色 */
        .btn-grade4 { background-color: #ffe1a8; color: #8a6d3b; } /* 柔和黃 */
        .btn-grade4:hover { background-color: #ffd88f; }

        .btn-grade5 { background-color: #c7ceea; color: #6a7194; } /* 柔和紫 */
        .btn-grade5:hover { background-color: #b8c0e0; }

        /* 聽音按鈕 */
        .btn-listen { background-color: #a2d2ff; color: white; margin-bottom: 20px;}
        .btn-listen:hover { background-color: #89c4ff; }

        /* 重新開始按鈕 */
        .btn-restart { background-color: #ffb7b2; color: white; margin-top: 30px;}
        .btn-restart:hover { background-color: #ff9e99; }
        
        /* 隱藏區塊 */
        .hidden { display: none; }

        /* 題目區塊 */
        #question-box { margin: 10px 0; }
        #question-text { 
            font-size: 36px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #666;
            word-wrap: break-word;
        }

        /* 選項網格 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        /* 選項按鈕：簡約白底藍框，看起來更乾淨 */
        .option-btn {
            background-color: #fff;
            border: 3px solid #e1f5fe;
            color: #777;
            font-size: 20px;
            box-shadow: none;
            padding: 20px;
        }
        .option-btn:hover {
            background-color: #e1f5fe;
            border-color: #b3e5fc;
            transform: scale(1.03);
            box-shadow: 0 5px 10px rgba(179, 229, 252, 0.3);
        }

        /* 回饋區塊 */
        #feedback { 
            font-size: 22px; 
            font-weight: bold; 
            height: 40px; 
            line-height: 40px; 
            margin-top: 25px;
            border-radius: 10px;
        }
        .correct { color: #b5e7a0; background-color: #f0fff0; } /* 柔和綠 */
        .wrong { color: #ffb7b2; background-color: #fff5f5; } /* 柔和紅 */

        /* 記分板 */
        #score-board { 
            font-size: 16px; 
            color: #aaa; 
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        #score { color: #ff9aa2; font-weight: bold; font-size: 20px;}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>🚀 English Explorer</h1>
        <h2>英語探險家</h2>
        
        <div id="start-screen">
            <h3>你要挑戰哪一個關卡？</h3>
            <button class="btn-grade4" onclick="startGame(4)">🏆 四年級挑戰 (Grade 4)</button>
            <button class="btn-grade5" onclick="startGame(5)">🔥 五年級挑戰 (Grade 5)</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="score-board">Score: <span id="score">0</span> / <span id="total">10</span></div>
            
            <div id="question-box">
                <button class="btn-listen" onclick="playSound()">🔊 Listen</button>
                <div id="question-text">Question</div>
            </div>

            <div class="options-grid" id="options">
                </div>
            
            <div id="feedback"></div>

            <button class="btn-restart hidden" id="restart-btn" onclick="resetGame()">回首頁重新挑戰</button>
        </div>
    </div>

    <script>
        // --- JS 邏輯完全沒變，只有 UI 改進 ---

        // 四年級題庫
        const grade4Questions = [
            { q: "twenty-five", options: ["25", "35", "45", "55"], answer: "25" },
            { q: "forty-five", options: ["25", "35", "45", "55"], answer: "45" },
            { q: "Hurry up!", options: ["快點！", "等一下。", "對不起我遲到了。", "午餐時間。"], answer: "快點！" },
            { q: "What time is it?", options: ["It's four o'clock.", "I'm writing.", "She's swimming.", "Time for lunch."], answer: "It's four o'clock." },
            { q: "It's twelve fifty-five.", options: ["12:55", "12:15", "11:55", "1:55"], answer: "12:55" },
            { q: "swimming", options: ["游泳", "吃東西", "跑步", "寫字"], answer: "游泳" },
            { q: "reading", options: ["閱讀", "睡覺", "喝東西", "做"], answer: "閱讀" },
            { q: "What are you doing?", options: ["I'm writing.", "He's reading.", "She's swimming.", "It's four o'clock."], answer: "I'm writing." },
            { q: "What's she doing?", options: ["She's swimming.", "He's reading.", "I'm eating.", "Wait a minute."], answer: "She's swimming." },
            { q: "Time for lunch.", options: ["午餐時間。", "等一下。", "快點！", "對不起我遲到了。"], answer: "午餐時間。" }
        ];

        // 五年級題庫
        const grade5Questions = [
            { q: "five hundred", options: ["500", "50", "400", "600"], answer: "500" },
            { q: "one thousand", options: ["1000", "100", "10", "10000"], answer: "1000" },
            { q: "eyes", options: ["眼睛", "耳朵", "鼻子", "嘴巴"], answer: "眼睛" },
            { q: "My foot hurts.", options: ["我的腳痛。", "我的眼睛痛。", "他的腳痛。", "她的耳朵痛。"], answer: "我的腳痛。" },
            { q: "Be careful!", options: ["小心！", "你能幫我嗎？", "怎麼了？", "不客氣。"], answer: "小心！" },
            { q: "What's wrong?", options: ["怎麼了？", "你有發燒嗎？", "小心！", "不客氣。"], answer: "怎麼了？" },
            { q: "headache", options: ["頭痛", "牙痛", "胃痛", "發燒"], answer: "頭痛" },
            { q: "runny nose", options: ["流鼻水", "喉嚨痛", "感冒", "胃痛"], answer: "流鼻水" },
            { q: "Do you have a fever?", options: ["Yes, I do.", "Yes, he does.", "No, she doesn't.", "My foot hurts."], answer: "Yes, I do." },
            { q: "Does he have a headache?", options: ["No, he doesn't.", "Yes, I do.", "Yes, she does.", "You're welcome."], answer: "No, he doesn't." }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function startGame(grade) {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('restart-btn').classList.add('hidden');
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = ''; // 移除顏色類別
            
            score = 0;
            currentQuestionIndex = 0;
            document.getElementById('score').innerText = score;

            if (grade === 4) {
                currentQuestions = [...grade4Questions].sort(() => 0.5 - Math.random());
            } else {
                currentQuestions = [...grade5Questions].sort(() => 0.5 - Math.random());
            }
            
            currentQuestions = currentQuestions.slice(0, 10);
            document.getElementById('total').innerText = currentQuestions.length;

            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            const qData = currentQuestions[currentQuestionIndex];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = '';
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            let shuffledOptions = [...qData.options].sort(() => 0.5 - Math.random());

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, qData.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('feedback');
            
            // 鎖定所有按鈕，防止重複點擊
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selected === correct) {
                score++;
                document.getElementById('score').innerText = score;
                feedback.innerText = "🌟 Great Job!";
                feedback.className = "correct";
            } else {
                feedback.innerText = `Try Again! 正確答案是: ${correct}`;
                feedback.className = "wrong";
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1800); // 稍微延長一點時間讓他們看清楚答案
        }

        function endGame() {
            let message = '';
            if (score >= 8) message = '🎉 Amazing! You are a super explorer!';
            else if (score >= 5) message = '👍 Good job! Keep going!';
            else message = '💪 Keep practicing! You can do it!';

            document.getElementById('question-text').innerText = `Challenge Clear!`;
            document.getElementById('options').innerHTML = `<div style="font-size: 24px; color: #ff9aa2; margin-top: 20px;">你的總分是 ${score} / ${currentQuestions.length}<br><br>${message}</div>`;
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = '';
            document.getElementById('restart-btn').classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function playSound() {
            const textToSpeak = document.getElementById('question-text').innerText;
            if ('speechSynthesis' in window) {
                // 取消之前還沒唸完的，防止重疊
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.8; 
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Sorry, your browser does not support audio.");
            }
        }
    </script>
</body>
</html>
