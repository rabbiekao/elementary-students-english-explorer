<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Explorer 英語探險家</title>
    <style>
        body {
            font-family: "Varela Round", "Segoe UI Rounded", "Helvetica Neue Rounded", "Arial Rounded MT Bold", sans-serif;
            background-color: #f0faff; 
            color: #555;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px 30px;
            border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(173, 216, 230, 0.3); 
        }

        h1 { color: #ff9aa2; font-size: 32px; margin-bottom: 10px; }
        h2 { color: #a2d2ff; font-weight: normal; margin-bottom: 30px; }
        h3 { color: #666; margin-bottom: 15px; }

        .grade-section {
            background-color: #f8f9fa;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #dcdde1;
        }

        button {
            border: none;
            padding: 12px 20px;
            margin: 8px 5px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit; 
            border-radius: 50px; 
            cursor: pointer;
            transition: all 0.2s ease; 
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); 
        }

        button:hover { transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0,0,0,0.1); }
        button:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-listen-mode { background-color: #ffe1a8; color: #8a6d3b; } 
        .btn-listen-mode:hover { background-color: #ffd88f; }
        .btn-write-mode { background-color: #c7ceea; color: #6a7194; } 
        .btn-write-mode:hover { background-color: #b8c0e0; }
        .btn-phonics-mode { background-color: #ffb7b2; color: #c94c4c; } 
        .btn-phonics-mode:hover { background-color: #ff9e99; }
        
        .btn-action { background-color: #a2d2ff; color: white; margin-bottom: 15px;}
        .btn-action:hover { background-color: #89c4ff; }
        
        .btn-speed { background-color: #ffd166; color: #8a6d3b; margin-bottom: 15px;}
        .btn-speed:hover { background-color: #ffc233; }

        .btn-submit { background-color: #b5e7a0; color: #4a7c34; font-size: 20px; padding: 15px 30px;}
        .btn-submit:hover { background-color: #9cdb82; }
        .btn-restart { background-color: #e2e8f0; color: #64748b; margin-top: 20px;}
        .btn-restart:hover { background-color: #cbd5e1; }
        .btn-review { background-color: #ff9e99; color: white; margin-top: 20px; font-size: 18px; animation: pulse 1.5s infinite;}
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-exit { background-color: #e2e8f0; color: #64748b; padding: 8px 15px; font-size: 14px; margin: 0; box-shadow: none; }
        .btn-exit:hover { background-color: #cbd5e1; color: #475569; transform: scale(1.05); box-shadow: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }

        #question-box { margin: 10px 0; }
        #question-text { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #666; word-wrap: break-word; line-height: 1.4; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        
        .option-btn { background-color: #fff; border: 3px solid #e1f5fe; color: #555; font-size: 20px; box-shadow: none; padding: 15px 10px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .option-btn:hover { background-color: #e1f5fe; border-color: #b3e5fc; transform: scale(1.03); }
        .option-en-text { font-size: 16px; color: #888; margin-top: 4px; font-weight: normal; }

        #write-box { margin-top: 20px; }
        
        #hint-text { font-size: 26px; color: #a2d2ff; letter-spacing: 4px; font-family: monospace; font-weight: bold; margin-bottom: 15px; }

        input[type="text"] {
            padding: 15px;
            font-size: 22px;
            border-radius: 15px;
            border: 3px solid #e1f5fe;
            width: 80%;
            max-width: 350px;
            text-align: center;
            font-family: inherit;
            outline: none;
            margin-bottom: 20px;
            color: #555;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #a2d2ff; }

        #feedback { font-size: 22px; font-weight: bold; min-height: 40px; line-height: 40px; margin-top: 20px; border-radius: 10px; padding: 5px; }
        .correct { color: #b5e7a0; background-color: #f0fff0; } 
        .wrong { color: #ffb7b2; background-color: #fff5f5; } 

        #score-board { font-size: 16px; color: #aaa; margin-bottom: 20px; letter-spacing: 1px; }
        #score { color: #ff9aa2; font-weight: bold; font-size: 20px;}
        .mode-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0; background: #eee;}
        
        .next-stage-container { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #e1f5fe; }
        .next-stage-container p { color: #a2d2ff; font-weight: bold; margin-bottom: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>🚀 English Explorer</h1>
        <h2>英語探險家</h2>
        
        <div id="start-screen">
            <div class="grade-section">
                <h3>🏆 四下 (Grade 4) - Unit 2</h3>
                <button class="btn-listen-mode" onclick="startGame(4, 'listen')">🎧 聽力測驗</button>
                <button class="btn-phonics-mode" onclick="startGame(4, 'phonics')">🗣️ 自然發音</button>
                <button class="btn-write-mode" onclick="startGame(4, 'write')">✍️ 聽音拼寫</button>
            </div>
            <div class="grade-section">
                <h3>🔥 五下 (Grade 5) - Unit 2</h3>
                <button class="btn-listen-mode" onclick="startGame(5, 'listen')">🎧 聽力測驗</button>
                <button class="btn-phonics-mode" onclick="startGame(5, 'phonics')">🗣️ 自然發音</button>
                <button class="btn-write-mode" onclick="startGame(5, 'write')">✍️ 聽音拼寫</button>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <div class="top-bar">
                <div id="current-mode-badge" class="mode-badge">Mode</div>
                <button class="btn-exit" onclick="resetGame()">🏠 回首頁</button>
            </div>

            <div id="score-board">Score: <span id="score">0</span> / <span id="total">10</span></div>
            
            <div id="question-box">
                <button class="btn-action hidden" id="btn-replay-sound" onclick="playCurrentSound()">🔊 聽聲音</button>
                <button class="btn-speed hidden" id="btn-speed-toggle" onclick="toggleSpeed()">🏃 正常語速</button>
                <div id="question-text">Question</div>
            </div>

            <div class="options-grid" id="options"></div>
            
            <div id="write-box" class="hidden">
                <div id="hint-text"></div>
                
                <input type="text" id="answer-input" placeholder="請輸入英文..." autocomplete="off">
                <br>
                <button class="btn-submit" onclick="checkWrittenAnswer()">送出答案</button>
            </div>
            
            <div id="feedback"></div>

            <button class="btn-review hidden" id="review-btn" onclick="startReview()">🔥 挑戰錯題</button>
            
            <!-- 引導下一關的容器 -->
            <div id="next-stage-box" class="next-stage-container hidden">
                <p>✨ 挑戰下一關：</p>
                <div id="next-stage-buttons"></div>
                <button class="btn-restart" id="restart-btn" onclick="resetGame()">🏠 休息一下，回首頁</button>
            </div>
        </div>
    </div>

    <script>
        // 四下 Unit 2 題庫
        const grade4Data = [

            { type: "vocab", en: "reading", zh: "閱讀", options: ["寫字|writing", "閱讀|reading", "做...|doing", "游泳|swimming"] },

            { type: "vocab", en: "doing", zh: "做...", options: ["做...|doing", "跑步|running", "閱讀|reading", "吃東西|eating"] },
            
            { type: "sentence", en: "Wait a minute.", zh: "等一下。", options: ["等一下。|Wait a minute.", "午餐時間。|Time for lunch.", "你在做什麼？|What are you doing?", "我正在寫字。|I'm writing."] },
            { type: "sentence", en: "Time for lunch.", zh: "午餐時間。", options: ["午餐時間。|Time for lunch.", "等一下。|Wait a minute.", "她在做什麼？|What's she doing?", "他正在閱讀。|He's reading."] },
            { type: "sentence", en: "What are you doing?", zh: "你在做什麼？", options: ["你在做什麼？|What are you doing?", "他在做什麼？|What's he doing?", "她在做什麼？|What's she doing?", "我正在寫字。|I'm writing."] },
            { type: "sentence", en: "I'm writing.", zh: "我正在寫字。", options: ["我正在寫字。|I'm writing.", "她正在游泳。|She's swimming.", "他正在閱讀。|He's reading.", "午餐時間。|Time for lunch."] },
            { type: "sentence", en: "What's she doing?", zh: "她在做什麼？", options: ["她在做什麼？|What's she doing?", "你在做什麼？|What are you doing?", "他在做什麼？|What's he doing?", "她正在游泳。|She's swimming."] },
            { type: "sentence", en: "She's swimming.", zh: "她正在游泳。", options: ["她正在游泳。|She's swimming.", "我正在寫字。|I'm writing.", "他正在閱讀。|He's reading.", "等一下。|Wait a minute."] },
            { type: "sentence", en: "What's he doing?", zh: "他在做什麼？", options: ["他在做什麼？|What's he doing?", "你在做什麼？|What are you doing?", "她在做什麼？|What's she doing?", "他正在閱讀。|He's reading."] },
            { type: "sentence", en: "He's reading.", zh: "他正在閱讀。", options: ["他正在閱讀。|He's reading.", "她正在游泳。|She's swimming.", "我正在寫字。|I'm writing.", "等一下。|Wait a minute."] },

            { type: "phonics", en: "kit", zh: "聽音辨字", options: ["kit", "kite", "bike", "Tim"] },
            { type: "phonics", en: "kite", zh: "聽音辨字", options: ["kite", "kit", "ripe", "rip"] },

            { type: "phonics", en: "rip", zh: "聽音辨字", options: ["rip", "ripe", "Tim", "time"] },
            { type: "phonics", en: "ripe", zh: "聽音辨字", options: ["ripe", "rip", "fine", "fin"] },
            { type: "phonics", en: "fin", zh: "聽音辨字", options: ["fin", "fine", "kit", "kite"] },
            { type: "phonics", en: "fine", zh: "聽音辨字", options: ["fine", "fin", "time", "Tim"] }
        ];

        // 五下 Unit 2 題庫
        const grade5Data = [
            { type: "vocab", en: "cold", zh: "感冒", options: ["感冒|cold", "發燒|fever", "頭痛|headache", "胃痛|stomachache"] },
            { type: "vocab", en: "fever", zh: "發燒", options: ["發燒|fever", "流鼻涕|runny nose", "感冒|cold", "牙痛|toothache"] },
            { type: "vocab", en: "runny nose", zh: "流鼻水", options: ["流鼻水|runny nose", "喉嚨痛|sore throat", "頭痛|headache", "發燒|fever"] },
            { type: "vocab", en: "sore throat", zh: "喉嚨痛", options: ["喉嚨痛|sore throat", "牙痛|toothache", "胃痛|stomachache", "感冒|cold"] },
            { type: "vocab", en: "headache", zh: "頭痛", options: ["頭痛|headache", "胃痛|stomachache", "發燒|fever", "流鼻水|runny nose"] },
            { type: "vocab", en: "toothache", zh: "牙痛", options: ["牙痛|toothache", "喉嚨痛|sore throat", "感冒|cold", "頭痛|headache"] },
            { type: "vocab", en: "stomachache", zh: "胃痛", options: ["胃痛|stomachache", "頭痛|headache", "牙痛|toothache", "發燒|fever"] },
            { type: "vocab", en: "have", zh: "有 (我/你)", options: ["有 (我/你)|have", "有 (他/她)|has", "感冒|cold", "發燒|fever"] },
            { type: "vocab", en: "has", zh: "有 (他/她)", options: ["有 (他/她)|has", "有 (我/你)|have", "胃痛|stomachache", "頭痛|headache"] },

            { type: "sentence", en: "May I help you?", zh: "需要幫忙嗎？", options: ["需要幫忙嗎？|May I help you?", "不客氣。|You're welcome.", "你有發燒嗎？|Do you have a fever?", "他頭痛嗎？|Does he have a headache?"] },
            { type: "sentence", en: "You're welcome.", zh: "不客氣。", options: ["不客氣。|You're welcome.", "需要幫忙嗎？|May I help you?", "是的，我有。|Yes, I do.", "是的，她有。|Yes, she does."] },
            { type: "sentence", en: "Do you have a fever?", zh: "你有發燒嗎？", options: ["你有發燒嗎？|Do you have a fever?", "他頭痛嗎？|Does he have a headache?", "她頭痛嗎？|Does she have a headache?", "需要幫忙嗎？|May I help you?"] },
            { type: "sentence", en: "Yes, I do.", zh: "是的，我有。", options: ["是的，我有。|Yes, I do.", "是的，他有。|Yes, he does.", "是的，她有。|Yes, she does.", "不客氣。|You're welcome."] },
            { type: "sentence", en: "No, I don't. I have a runny nose.", zh: "不，我沒有。我流鼻水。", options: ["不，我沒有。我流鼻水。|No, I don't. I have a runny nose.", "不，他沒有。他胃痛。|No, he doesn't. He has a stomachache.", "不，她沒有。她胃痛。|No, she doesn't. She has a stomachache.", "是的，我有。|Yes, I do."] },
            { type: "sentence", en: "Does he have a headache?", zh: "他頭痛嗎？", options: ["他頭痛嗎？|Does he have a headache?", "她頭痛嗎？|Does she have a headache?", "你有發燒嗎？|Do you have a fever?", "需要幫忙嗎？|May I help you?"] },
            { type: "sentence", en: "Yes, he does.", zh: "是的，他有。", options: ["是的，他有。|Yes, he does.", "是的，她有。|Yes, she does.", "是的，我有。|Yes, I do.", "不客氣。|You're welcome."] },
            { type: "sentence", en: "No, he doesn't. He has a stomachache.", zh: "不，他沒有。他胃痛。", options: ["不，他沒有。他胃痛。|No, he doesn't. He has a stomachache.", "不，她沒有。她胃痛。|No, she doesn't. She has a stomachache.", "不，我沒有。我流鼻水。|No, I don't. I have a runny nose.", "是的，他有。|Yes, he does."] },
            { type: "sentence", en: "Does she have a headache?", zh: "她頭痛嗎？", options: ["她頭痛嗎？|Does she have a headache?", "他頭痛嗎？|Does he have a headache?", "你有發燒嗎？|Do you have a fever?", "需要幫忙嗎？|May I help you?"] },
            { type: "sentence", en: "Yes, she does.", zh: "是的，她有。", options: ["是的，她有。|Yes, she does.", "是的，他有。|Yes, he does.", "是的，我有。|Yes, I do.", "不客氣。|You're welcome."] },
            { type: "sentence", en: "No, she doesn't. She has a stomachache.", zh: "不，她沒有。她胃痛。", options: ["不，她沒有。她胃痛。|No, she doesn't. She has a stomachache.", "不，他沒有。他胃痛。|No, he doesn't. He has a stomachache.", "不，我沒有。我流鼻水。|No, I don't. I have a runny nose.", "是的，她有。|Yes, she does."] },

            { type: "phonics", en: "Pete", zh: "聽音辨字", options: ["Pete", "pet", "net", "neat"] },

            { type: "phonics", en: "these", zh: "聽音辨字", options: ["these", "tea", "Ted", "sheep"] },
            { type: "phonics", en: "net", zh: "聽音辨字", options: ["net", "neat", "pet", "Pete"] },
            { type: "phonics", en: "neat", zh: "聽音辨字", options: ["neat", "net", "cheap", "sheep"] },
            { type: "phonics", en: "green", zh: "聽音辨字", options: ["green", "sheep", "sick", "seek"] },
            { type: "phonics", en: "sheep", zh: "聽音辨字", options: ["sheep", "cheap", "these", "tea"] },
            { type: "phonics", en: "sick", zh: "聽音辨字", options: ["sick", "seek", "pet", "Pete"] },
            { type: "phonics", en: "seek", zh: "聽音辨字", options: ["seek", "sick", "net", "neat"] },
            { type: "phonics", en: "tea", zh: "聽音辨字", options: ["tea", "Ted", "these", "cheap"] },
            { type: "phonics", en: "Ted", zh: "聽音辨字", options: ["Ted", "tea", "pet", "Pete"] },
            { type: "phonics", en: "cheap", zh: "聽音辨字", options: ["cheap", "sheep", "neat", "net"] }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = []; 
        let gameMode = 'listen'; 
        let currentGameGrade = 4;
        let availableVoices = [];
        let isProcessing = false; 
        
        let currentSpeechRate = 0.9; 

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                availableVoices = window.speechSynthesis.getVoices();
            };
        }

        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkWrittenAnswer();
            }
        });

        function toggleSpeed() {
            const speedBtn = document.getElementById('btn-speed-toggle');
            if (currentSpeechRate === 0.9) {
                currentSpeechRate = 0.55; 
                speedBtn.innerText = '🐢 超慢速播放';
                speedBtn.style.backgroundColor = '#f4a261'; 
                speedBtn.style.color = 'white';
            } else {
                currentSpeechRate = 0.9;
                speedBtn.innerText = '🏃 正常語速';
                speedBtn.style.backgroundColor = '#ffd166';
                speedBtn.style.color = '#8a6d3b';
            }
            playCurrentSound(); 
        }

        function generateHint(text) {
            let result = "";
            let isFirstLetter = true;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (/[a-zA-Z]/.test(c)) {
                    if (isFirstLetter) {
                        result += c + " ";
                        isFirstLetter = false;
                    } else {
                        result += "_ ";
                    }
                } else {
                    result += c + " ";
                    isFirstLetter = true; 
                }
            }
            return result.trim();
        }

        function startGame(grade, mode) {
            currentGameGrade = grade;
            gameMode = mode;
            mistakes = []; 
            
            let dataset = grade === 4 ? grade4Data : grade5Data;
            
            // 根據模式篩選題庫
            if (mode === 'phonics') {
                dataset = dataset.filter(q => q.type === 'phonics');
            } else {
                dataset = dataset.filter(q => q.type !== 'phonics');
            }
            
            currentQuestions = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            let badgeColor, badgeText;
            if (mode === 'listen') {
                badgeColor = '#ffe1a8';
                badgeText = `🎧 ${grade}下 聽力測驗`;
            } else if (mode === 'write') {
                badgeColor = '#c7ceea';
                badgeText = `✍️ ${grade}下 聽音拼寫`;
            } else {
                badgeColor = '#ffb7b2';
                badgeText = `🗣️ ${grade}下 自然發音`;
            }

            document.getElementById('current-mode-badge').innerText = badgeText;
            document.getElementById('current-mode-badge').style.backgroundColor = badgeColor;

            currentSpeechRate = 0.9;
            document.getElementById('btn-speed-toggle').innerText = '🏃 正常語速';
            document.getElementById('btn-speed-toggle').style.backgroundColor = '#ffd166';
            document.getElementById('btn-speed-toggle').style.color = '#8a6d3b';

            initGameUI();
        }

        function startReview() {
            currentQuestions = [...mistakes].sort(() => 0.5 - Math.random());
            mistakes = []; 
            document.getElementById('current-mode-badge').innerText = `🔥 錯題特訓區`;
            document.getElementById('current-mode-badge').style.backgroundColor = '#ffb7b2';
            initGameUI();
        }

        function initGameUI() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('review-btn').classList.add('hidden');
            document.getElementById('next-stage-box').classList.add('hidden');
            
            score = 0;
            currentQuestionIndex = 0;
            isProcessing = false;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = currentQuestions.length;

            loadQuestion();
        }

        function loadQuestion() {
            isProcessing = false; 
            
            if (currentQuestionIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            const qData = currentQuestions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');
            feedback.innerText = '';
            feedback.className = '';
            
            if (gameMode === 'listen' || gameMode === 'phonics') {
                let promptText = gameMode === 'phonics' ? '👂 聽音辨字：\n請仔細聽發音，選出正確的單字！' : '👂 請仔細聽，選出正確意思';
                document.getElementById('question-text').innerText = promptText;
                document.getElementById('btn-replay-sound').classList.remove('hidden');
                document.getElementById('btn-speed-toggle').classList.remove('hidden');
                document.getElementById('options').classList.remove('hidden');
                document.getElementById('write-box').classList.add('hidden');
                
                const optionsDiv = document.getElementById('options');
                optionsDiv.innerHTML = '';
                
                let correctAnswer = gameMode === 'phonics' ? qData.en : qData.zh + "|" + qData.en; 
                let wrongOptions = qData.options.filter(opt => opt !== correctAnswer); 
                let randomWrong = wrongOptions[Math.floor(Math.random() * wrongOptions.length)]; 
                
                let finalOptions = [correctAnswer, randomWrong].sort(() => 0.5 - Math.random());

                finalOptions.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    
                    if (opt.includes('|')) {
                        let parts = opt.split('|');
                        btn.innerHTML = `<span>${parts[0]}</span><span class="option-en-text">${parts[1]}</span>`;
                    } else {
                        btn.innerText = opt; 
                    }

                    btn.onclick = () => checkAnswer(opt, qData);
                    optionsDiv.appendChild(btn);
                });

                playCurrentSound();

            } else {
                document.getElementById('options').classList.add('hidden');
                document.getElementById('write-box').classList.remove('hidden');
                document.getElementById('btn-replay-sound').classList.remove('hidden');
                document.getElementById('btn-speed-toggle').classList.remove('hidden');
                
                document.getElementById('question-text').innerText = `👂 聽音拼字：\n請聽發音並搭配提示拼出英文\n(中文：${qData.zh})`;
                document.getElementById('hint-text').innerText = generateHint(qData.en);

                const inputField = document.getElementById('answer-input');
                inputField.value = '';
                inputField.placeholder = "請輸入英文...";
                inputField.style.borderColor = "#e1f5fe";
                inputField.disabled = false;
                
                const submitBtn = document.querySelector('.btn-submit');
                submitBtn.disabled = false;
                setTimeout(() => inputField.focus(), 200); 
                
                playCurrentSound(); 
            }
        }

        function checkAnswer(selected, qData) {
            if (isProcessing) return; 
            isProcessing = true;
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            let isCorrect = false;
            let correctText = '';
            
            if (gameMode === 'phonics') {
                isCorrect = (selected === qData.en);
                correctText = qData.en;
            } else {
                let expected = qData.zh + "|" + qData.en;
                isCorrect = (selected === expected);
                correctText = qData.zh + " " + qData.en; 
            }
            
            processResult(isCorrect, correctText, qData);
        }

        function cleanString(str) {
            return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
        }

        function checkWrittenAnswer() {
            if (isProcessing) return;

            const inputField = document.getElementById('answer-input');
            const submitBtn = document.querySelector('.btn-submit');
            const userAnswer = inputField.value;
            
            if (userAnswer.trim() === '') {
                inputField.placeholder = "⚠️ 請先輸入英文喔！";
                inputField.style.borderColor = "#ffb7b2";
                setTimeout(() => inputField.style.borderColor = "#e1f5fe", 1500);
                return; 
            }

            isProcessing = true;
            inputField.disabled = true;
            submitBtn.disabled = true;

            const qData = currentQuestions[currentQuestionIndex];
            const isCorrect = cleanString(userAnswer) === cleanString(qData.en);
            
            processResult(isCorrect, qData.en, qData);
        }

        function processResult(isCorrect, correctAnswerText, fullData) {
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
                feedback.innerText = "🌟 Great Job! 完全正確！";
                feedback.className = "correct";
            } else {
                feedback.innerText = `Oops! 正確答案是: ${correctAnswerText}`;
                feedback.className = "wrong";
                if (!mistakes.includes(fullData)) {
                    mistakes.push(fullData);
                }
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 2500); 
        }

        function endGame() {
            document.getElementById('btn-replay-sound').classList.add('hidden');
            document.getElementById('btn-speed-toggle').classList.add('hidden');
            document.getElementById('options').classList.add('hidden');
            document.getElementById('write-box').classList.add('hidden');
            
            let message = '';
            if (score === currentQuestions.length) message = '🎉 滿分太神啦！You are a super explorer!';
            else if (score >= currentQuestions.length * 0.6) message = '👍 很棒喔！有幾題小粗心，要不要再挑戰？';
            else message = '💪 沒關係！把錯的練熟就會變超強！';

            document.getElementById('question-text').innerText = `Challenge Clear!`;
            const resultHtml = `<div style="font-size: 24px; color: #ff9aa2; margin-top: 20px;">你的總分是 ${score} / ${currentQuestions.length}<br><br>${message}</div>`;
            document.getElementById('options').innerHTML = resultHtml;
            document.getElementById('options').classList.remove('hidden');
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = '';
            
            if (mistakes.length > 0) {
                const reviewBtn = document.getElementById('review-btn');
                reviewBtn.innerText = `🔥 挑戰剛剛錯的 ${mistakes.length} 題`;
                reviewBtn.classList.remove('hidden');
            }

            // 引導學生進行下一個測驗
            const nextStageBox = document.getElementById('next-stage-box');
            const nextStageBtns = document.getElementById('next-stage-buttons');
            let nextButtonsHtml = '';
            
            if (gameMode !== 'listen') {
                nextButtonsHtml += `<button class="btn-listen-mode" onclick="startGame(${currentGameGrade}, 'listen')">🎧 挑戰聽力測驗</button>`;
            }
            if (gameMode !== 'phonics') {
                nextButtonsHtml += `<button class="btn-phonics-mode" onclick="startGame(${currentGameGrade}, 'phonics')">🗣️ 挑戰自然發音</button>`;
            }
            if (gameMode !== 'write') {
                nextButtonsHtml += `<button class="btn-write-mode" onclick="startGame(${currentGameGrade}, 'write')">✍️ 挑戰聽音拼寫</button>`;
            }
            
            nextStageBtns.innerHTML = nextButtonsHtml;
            nextStageBox.classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('options').innerHTML = '';
            document.getElementById('question-text').innerText = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = '';
            document.getElementById('next-stage-box').classList.add('hidden');
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playCurrentSound() {
            const qData = currentQuestions[currentQuestionIndex];
            if (!qData) return;
            
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    
                    setTimeout(() => {
                        const utterance = new SpeechSynthesisUtterance(qData.en);
                        
                        if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

                        let bestVoice = availableVoices.find(v => v.name.includes('Google US English')) ||
                                        availableVoices.find(v => v.name.includes('Microsoft Zira')) ||
                                        availableVoices.find(v => v.name.includes('Samantha')) ||
                                        availableVoices.find(v => v.lang === 'en-US' || v.lang === 'en-GB');

                        if (bestVoice) utterance.voice = bestVoice;

                        utterance.lang = 'en-US'; 
                        utterance.rate = currentSpeechRate; 
                        utterance.pitch = 1.0; 
                        
                        window.speechSynthesis.speak(utterance);
                    }, 100); 
                }
            } catch (error) {
                console.log("語音播放暫時無法使用", error);
            }
        }
    </script>
</body>
</html>
